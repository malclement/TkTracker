name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: swift test

      - name: Check tag matches bundle version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $VERSION" >&2
            exit 1
          fi

      # Signing is optional so the workflow still produces an artifact on forks
      # and before the Developer ID is configured. With the secrets present the
      # release is Developer ID signed, notarized and stapled; without them it
      # falls back to ad-hoc and the release notes say so.
      - name: Detect signing capability
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Production releases require Developer ID and Apple notarization credentials. Use CI artifacts for an unsigned candidate."
            exit 1
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          # Build in a dedicated keychain so nothing leaks into the runner's
          # default one and the private key is unlocked only for this job.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign prompts for keychain access and hangs the job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      - name: Build, notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          make notarize APP_BUILDER=xcode \
            SIGN_IDENTITY="$SIGN_IDENTITY" \
            APPLE_ID="$APPLE_ID" TEAM_ID="$TEAM_ID" APP_PASSWORD="$APP_PASSWORD"
          # Strict: the release notes below assert this build is notarized and
          # stapled, so an artifact that cannot prove it must fail the job rather
          # than be published with a false claim.
          make verify-signature-strict smoke

      # Runs even when the build fails: otherwise the Developer ID private key
      # and its keychain password outlive the job on a self-hosted or reused
      # runner.
      - name: Destroy signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security list-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ steps.signing.outputs.enabled }}
        # Notes are assembled into a file rather than an inline --notes argument.
        # A multi-line shell string inside a YAML block scalar has to keep every
        # continuation line indented past the block marker; getting that wrong
        # makes the whole workflow unparseable, which is a failure GitHub reports
        # only as "workflow file issue" at runtime.
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Published so the Homebrew cask's sha256 comes from the release itself
          # rather than from trusting whatever is served at the URL later.
          DIGEST=$(shasum -a 256 "dist/TkTracker-$VERSION.zip" | cut -d' ' -f1)
          echo "sha256: $DIGEST"
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            if [ "$NOTARIZED" = "true" ]; then
              echo '> [!NOTE]'
              echo '> Signed with a Developer ID and notarized by Apple — open it normally,'
              echo '> no quarantine step needed.'
            else
              echo '> [!WARNING]'
              echo '> This build is ad-hoc signed and **not notarized**. After unzipping and'
              echo '> moving `TkTracker.app` to `/Applications`, clear the quarantine flag once:'
              echo '>'
              echo '> `xattr -dr com.apple.quarantine /Applications/TkTracker.app`'
              echo '>'
              echo '> — or build from source with `make install`.'
            fi
            echo
            echo '<details><summary>Homebrew cask checksum</summary>'
            echo
            echo '```ruby'
            echo "sha256 \"$DIGEST\""
            echo '```'
            echo '</details>'
          } > "$NOTES"
          gh release create "$GITHUB_REF_NAME" \
            "dist/TkTracker-$VERSION.zip" \
            --title "TkTracker $VERSION" \
            --generate-notes \
            --notes-file "$NOTES"
