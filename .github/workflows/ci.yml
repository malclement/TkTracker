name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # A malformed workflow file is only reported at dispatch time, as an
      # opaque "workflow file issue" with a 0s run — which is how a broken
      # release.yml got as far as a pushed tag once. Parsing them here turns that
      # into an ordinary red build on the PR that introduces it.
      # Ruby, not Python: PyYAML is not installed on the macOS runner image,
      # whereas Ruby ships with macOS and has YAML in its standard library. This
      # step needs zero setup, or it becomes another thing that can fail for
      # reasons unrelated to what it checks.
      - name: Validate workflow files
        run: |
          ruby -ryaml -e '
            bad = false
            Dir.glob(".github/workflows/*.yml").sort.each do |path|
              begin
                doc = YAML.safe_load(File.read(path), aliases: true)
              rescue => e
                puts "::error file=#{path}::unparseable: #{e.message}"
                bad = true
                next
              end
              # `on:` parses as the boolean true under YAML 1.1.
              unless doc[true] || doc["on"]
                puts "::error file=#{path}::no trigger - the workflow would never run"
                bad = true
              end
              unless doc["jobs"] && !doc["jobs"].empty?
                puts "::error file=#{path}::no jobs"
                bad = true
              end
              puts "#{path}: ok"
            end
            exit(bad ? 1 : 0)
          '

      - name: Swift version
        run: swift --version

      - name: Check generated pricing catalog
        run: python3 Scripts/generate_pricing.py --check

      - name: Run tests
        run: swift test

      - name: Build zipped app bundle
        run: make zip smoke APP_BUILDER=xcode

      # upload-artifact strips executable bits from bare directories, so
      # upload the ditto-made zip to keep the .app launchable.
      - name: Upload app bundle
        uses: actions/upload-artifact@v5
        with:
          name: TkTracker-app
          path: dist/TkTracker-*.zip
          if-no-files-found: error
