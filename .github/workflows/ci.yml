name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # A malformed workflow file is only reported at dispatch time, as an
      # opaque "workflow file issue" with a 0s run — which is how a broken
      # release.yml got as far as a pushed tag once. Parsing them here turns that
      # into an ordinary red build on the PR that introduces it.
      - name: Validate workflow files
        run: |
          python3 - <<'PY'
          import sys, glob, yaml
          bad = False
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  document = yaml.safe_load(open(path))
              except Exception as error:
                  print(f"::error file={path}::unparseable: {error}")
                  bad = True
                  continue
              # `on:` parses as the boolean True in YAML 1.1.
              if not (document.get(True) or document.get("on")):
                  print(f"::error file={path}::no trigger — the workflow would never run")
                  bad = True
              if not document.get("jobs"):
                  print(f"::error file={path}::no jobs")
                  bad = True
              print(f"{path}: ok")
          sys.exit(1 if bad else 0)
          PY

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Build zipped app bundle
        run: make zip

      # upload-artifact strips executable bits from bare directories, so
      # upload the ditto-made zip to keep the .app launchable.
      - name: Upload app bundle
        uses: actions/upload-artifact@v5
        with:
          name: TkTracker-app
          path: dist/TkTracker-*.zip
          if-no-files-found: error
